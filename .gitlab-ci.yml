# GitLab CI/CD Pipeline for Kalamar-Plugin-Export
# This pipeline runs tests on pushes and builds Docker containers on tag pushes and manual triggers

stages:
  - test-and-build
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_IMAGE_NAME: "korap/kalamar-plugin-export"

# Cache Maven dependencies
cache:
  paths:
    - .m2/repository/

# Test and build stage - runs on all pushes
test-and-build:
  stage: test-and-build
  image: maven:3-eclipse-temurin-21
  before_script:
    - export MAVEN_OPTS="$MAVEN_OPTS"
  script:
    - mvn $MAVEN_CLI_OPTS clean test package
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
      - target/*.jar
    expire_in: 1 week
  only:
    - pushes
    - merge_requests

# Build Docker image stage - runs automatically for tags and is manually triggerable otherwise
build-docker:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    # Non-TLS dind, as in Kustvakt
    FF_NETWORK_PER_BUILD: "true"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - apk add --no-cache xz
  script:
    - CLEAN_TAG="${CI_COMMIT_TAG#v}"
    - CLEAN_TAG="${CLEAN_TAG:-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA}"
    - docker build -t "$DOCKER_IMAGE_NAME:$CLEAN_TAG" .
    - docker save "$DOCKER_IMAGE_NAME:$CLEAN_TAG" | xz -c > "kalamar-plugin-export-$CLEAN_TAG.tar.xz"
    - ls -lh kalamar-plugin-export-*.tar.xz
  artifacts:
    paths:
      - "kalamar-plugin-export-*.tar.xz"
    expire_in: 30 days
  rules:
    - if: "$CI_COMMIT_TAG"
      when: on_success
    - when: manual
  allow_failure: false

# Security scan stage (optional)
security-scan:
  stage: build
  image: maven:3-eclipse-temurin-21
  before_script:
    - export MAVEN_OPTS="$MAVEN_OPTS"
  script:
    - mvn $MAVEN_CLI_OPTS clean compile
  allow_failure: true
  when: manual

# Deploy stage - push Docker image to Docker Hub
deploy:
  stage: deploy
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    FF_NETWORK_PER_BUILD: "true"
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: build-docker
      artifacts: true
  before_script:
    - docker info
    - apk add --no-cache xz
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - CLEAN_TAG="${CI_COMMIT_TAG#v}"
    - xz -d -c "kalamar-plugin-export-$CLEAN_TAG.tar.xz" | docker load
    - docker tag "$DOCKER_IMAGE_NAME:$CLEAN_TAG" "$DOCKER_IMAGE_NAME:latest"
    - docker push "$DOCKER_IMAGE_NAME:$CLEAN_TAG"
    - docker push "$DOCKER_IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]/'
      when: on_success
  allow_failure: false
